name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Offline eval gate (routing, tool use, no unapproved writes, cost, latency)
        run: python evals/run_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-offline
          path: evals/results/
